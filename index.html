<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
    <title>滑板人生 3D</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <canvas id="game"></canvas>
    <button class="soundBtn" onclick="toggleSound()">🔊</button>
    <button class="pauseBtn" id="pauseBtn" onclick="togglePause()">⏸</button>
    <button class="virtualBtn left" id="leftBtn" ontouchstart="virtualLeft()">◀</button>
    <button class="virtualBtn right" id="rightBtn" ontouchstart="virtualRight()">▶</button>

    <div id="startScreen" class="screen">
      <div class="title">🛹 滑板人生</div>
      <div class="subtitle">3D NEON RUNNER</div>
      <div class="modeSelect">
        <button class="modeBtn selected" id="modeStory" onclick="setMode('story')">
          🏆 闯关模式
        </button>
        <button class="modeBtn locked" id="modeEndless" onclick="setMode('endless')">
          ⚡ 极限模式
        </button>
      </div>
      <div class="difficulty">
        <button class="diffBtn easy" onclick="setDifficulty('easy')">简单</button>
        <button class="diffBtn medium selected" onclick="setDifficulty('medium')">中等</button>
        <button class="diffBtn hard" onclick="setDifficulty('hard')">困难</button>
      </div>
      <button class="gameBtn" onclick="startGame()">开始游戏</button>
      <div class="stats">
        最高分: <span id="highScoreDisplay">0</span> | 通关:
        <span id="levelProgressDisplay">0</span>/8
      </div>
    </div>

    <div id="gameUI">
      <div class="uiBox">⭐ <span id="scoreDisplay">0</span></div>
      <div class="uiBox">💎 <span id="coinDisplay">0</span></div>
      <div class="uiBox">🏃 <span id="distDisplay">0</span>m</div>
    </div>
    <div class="level" id="levelDisplay">第 1 关</div>
    <div class="levelProgress"><div class="levelProgressBar" id="progressBar"></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
